name: Bizi Zaragoza Ingestion

on:
  repository_dispatch:
    types: [trigger-ingest]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests pandas

      - name: Ejecutar script de ingestión
        run: python ingest.py

      - name: Guardar cambios en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/bizi-stats.csv
          
          # Hacer commit solo si hay cambios en el archivo
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): snapshot Bizi $(date -u +'%Y-%m-%d %H:%M')" && git push)
